<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" fill="none">
  <!-- Pole -->
  <line x1="10" y1="5" x2="10" y2="115" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <circle cx="10" cy="5" r="3" fill="#FFD700"/>

  <!-- Flag body -->
  <rect x="13" y="10" width="60" height="40" fill="#FFFFFF"/>

  <!-- Saffron stripe -->
  <rect x="13" y="10" width="60" height="13.33" fill="#FF9933"/>

  <!-- White stripe (middle) is the base rect -->

  <!-- Green stripe -->
