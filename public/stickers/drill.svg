<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" fill="none">
  <!-- Body -->
  <rect x="30" y="20" width="70" height="40" rx="8" fill="#F4D03F" stroke="#D4AC0D" stroke-width="2"/>
  <!-- Handle -->
  <rect x="30" y="50" width="35" height="30" rx="6" fill="#333" stroke="#222" stroke-width="1.5"/>
  <!-- Trigger -->
  <rect x="42" y="55" width="12" height="15" rx="3" fill="#555"/>
  <!-- Chuck -->
  <rect x="100" y="30" width="30" height="15" rx="3" fill="#999" stroke="#777" stroke-width="1.5"/>
  <!-- Bit -->
  <rect x="128" y="34" width="10" height="7" rx="1" fill="#aaa"/>
  <!-- Battery -->
  <rect x="30" y="45" width="25" height="10" rx="3" fill="#222"/>
  <!-- Vent -->
  <line x1="60" y1="28" x2="60" y2="38" stroke="#D4AC0D" stroke-width="1.5"/>
  <line x1="68" y1="28" x2="68" y2="38" stroke="#D4AC0D" stroke-width="1.5"/>
  <line x1="76" y1="28" x2="76" y2="38" stroke="#D4AC0D" stroke-width="1.5"/>
</svg>