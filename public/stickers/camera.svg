<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" fill="none">
  <!-- Polaroid camera body -->
  <rect x="10" y="20" width="100" height="75" rx="10" fill="#2C2C2C" stroke="#444" stroke-width="2"/>
  <!-- Rainbow stripe -->
  <rect x="10" y="70" width="100" height="5" fill="#E74C3C"/>
  <rect x="10" y="75" width="100" height="4" fill="#F39C12"/>
  <rect x="10" y="79" width="100" height="4" fill="#27AE60"/>
  <rect x="10" y="83" width="100" height="4" fill="#2980B9"/>
  <!-- Lens -->
  <circle cx="60" cy="48" r="22" fill="#1a1a1a" stroke="#555" stroke-width="2"/>
  <circle cx="60" cy="48" r="16" fill="#111" stroke="#444" stroke-width="1.5"/>
  <circle cx="60" cy="48" r="8" fill="#1e3a5f"/>
  <circle cx="55" cy="43" r="3" fill="rgba(255,255,255,0.3)"/>
  <!-- Flash -->
  <rect x="22" y="25" width="15" height="12" rx="2" fill="#888"/>
  <!-- Viewfinder -->
  <rect x="72" y="26" width="18" height="10" rx="3" fill="#555" stroke="#666" stroke-width="1"/>
  <!-- Output slot -->
  <rect x="25" y="87" width="70" height="6" rx="2" fill="#1a1a1a"/>
</svg>