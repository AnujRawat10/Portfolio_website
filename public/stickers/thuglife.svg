<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" fill="none">
  <!-- Left lens -->
  <rect x="5" y="15" width="50" height="30" rx="4" fill="#111" stroke="#333" stroke-width="2.5"/>
  <!-- Right lens -->
  <rect x="65" y="15" width="50" height="30" rx="4" fill="#111" stroke="#333" stroke-width="2.5"/>
  <!-- Bridge -->
  <path d="M55 25 Q60 20 65 25" stroke="#333" stroke-width="2.5" fill="none"/>
  <!-- Left arm -->
  <line x1="5" y1="22" x2="-5" y2="20" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="115" y1="22" x2="155" y2="18" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Glare -->
  <rect x="12" y="20" width="8" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="72" y="20" width="8" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
</svg>