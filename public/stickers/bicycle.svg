<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Wheels -->
  <circle cx="40" cy="80" r="28" stroke="#F4D03F" stroke-width="4" fill="none"/>
  <circle cx="120" cy="80" r="28" stroke="#F4D03F" stroke-width="4" fill="none"/>
  <circle cx="40" cy="80" r="3" fill="#F4D03F"/>
  <circle cx="120" cy="80" r="3" fill="#F4D03F"/>
  <!-- Spokes -->
  <line x1="40" y1="52" x2="40" y2="108" stroke="#F4D03F" stroke-width="1" opacity="0.5"/>
  <line x1="12" y1="80" x2="68" y2="80" stroke="#F4D03F" stroke-width="1" opacity="0.5"/>
  <line x1="120" y1="52" x2="120" y2="108" stroke="#F4D03F" stroke-width="1" opacity="0.5"/>
  <line x1="92" y1="80" x2="148" y2="80" stroke="#F4D03F" stroke-width="1" opacity="0.5"/>
  <!-- Frame -->
  <line x1="40" y1="80" x2="80" y2="50" stroke="#F4D03F" stroke-width="3.5"/>
  <line x1="80" y1="50" x2="120" y2="80" stroke="#F4D03F" stroke-width="3.5"/>
  <line x1="80" y1="50" x2="80" y2="80" stroke="#F4D03F" stroke-width="3"/>
  <line x1="40" y1="80" x2="80" y2="80" stroke="#F4D03F" stroke-width="3"/>
  <!-- Handlebars -->
  <line x1="120" y1="80" x2="130" y2="42" stroke="#F4D03F" stroke-width="3"/>
  <line x1="122" y1="45" x2="138" y2="40" stroke="#F4D03F" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat -->
  <line x1="80" y1="50" x2="72" y2="35" stroke="#F4D03F" stroke-width="3"/>
  <rect x="62" y="32" width="20" height="5" rx="2.5" fill="#F4D03F"/>
  <!-- Pedal -->
  <circle cx="80" cy="80" r="6" stroke="#F4D03F" stroke-width="2" fill="none"/>
</svg>